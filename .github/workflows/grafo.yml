name: Validar grafo

on:
  pull_request:
    paths:
      - "src/data/**"
      - "src/lib/grafo/**"
      - "src/content/**"
  push:
    branches: [main]
    paths:
      - "src/data/**"
      - "src/lib/grafo/**"
      - "src/content/**"

jobs:
  grafo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run grafo:validar
